<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f6fbff" />
<title>芽芽乐｜中英双语启蒙</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="logged-out">
<div class="app">
  <!-- 顶部品牌栏 + 双货币 -->
  <header id="hud" class="hud">
    <div style="display:flex;align-items:center">
      <button class="hud-back" id="hudBack" hidden>‹</button>
      <div class="brand" onclick="location.hash='#/home'">
        <div class="brand-mark">芽</div>
        <div class="brand-name"><b>芽芽乐</b><small>中英双语启蒙小屋</small></div>
      </div>
    </div>
    <div class="coinbar">
      <span class="coin" id="hudStars" title="星星：兑换宠物皮肤"><i>⭐</i><b>0</b></span>
      <span class="coin" id="hudPoints" title="积分：解锁宠物、购买食物"><i>🟡</i><b>0</b></span>
      <button class="hud-me" id="hudMe" title="个人中心" aria-label="个人中心">👤</button>
    </div>
  </header>

  <!-- 页面容器 -->
  <main class="screen"><div id="view" class="view"></div></main>

  <!-- 底部菜单导航 -->
  <nav class="bottom-nav" id="tabbar">
    <button class="nav-item" data-tab="study"><strong>🏠</strong>学习</button>
    <button class="nav-item" data-tab="pets"><strong>🐾</strong>宠物</button>
    <button class="nav-item" data-tab="parent"><strong>👪</strong>家长中心</button>
  </nav>
</div>

<!-- 底部弹层 -->
<div class="modal-mask" id="modalLayer"><div class="sheet" id="sheet"></div></div>
<div id="toastLayer" class="toast-layer"></div>
<canvas id="fxCanvas" class="fx-canvas"></canvas>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/tts.js"></script>
<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script src="js/learn.js"></script>
<script src="js/pages.js"></script>
<script src="js/app.js"></script>
</body>
</html>
